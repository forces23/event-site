<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#e0c270"/>
      <stop offset="45%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#9a7a2a"/>
    </linearGradient>
    <linearGradient id="gb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#9a7a2a"/>
      <stop offset="50%"  stop-color="#e0c270"/>
      <stop offset="100%" stop-color="#9a7a2a"/>
    </linearGradient>
    <radialGradient id="gem" cx="40%" cy="35%">
      <stop offset="0%"   stop-color="#93ccb4"/>
      <stop offset="60%"  stop-color="#6db89a"/>
      <stop offset="100%" stop-color="#3d8a6a"/>
    </radialGradient>
  </defs>

  <!-- Crown body -->
  <path
    d="M 5,90 L 5,55 L 27,70 L 50,10 L 73,70 L 95,55 L 95,90 Z"
    fill="url(#g)" stroke="#9a7a2a" stroke-width="1.5" stroke-linejoin="round"
  />

  <!-- Base band -->
  <rect x="5" y="76" width="90" height="14" rx="3"
    fill="url(#gb)" stroke="#9a7a2a" stroke-width="1"
  />

  <!-- Center peak star gem -->
  <polygon
    points="50,4 53,12 61,12 55,17 57,25 50,20 43,25 45,17 39,12 47,12"
    fill="url(#gem)" stroke="#3d8a6a" stroke-width="0.8"
  />
  <circle cx="50" cy="14" r="2.5" fill="rgba(255,255,255,0.7)"/>

  <!-- Left peak gem -->
  <circle cx="27" cy="70" r="6"   fill="url(#gem)" stroke="#3d8a6a" stroke-width="1"/>
  <circle cx="27" cy="70" r="2.5" fill="rgba(255,255,255,0.6)"/>

  <!-- Right peak gem -->
  <circle cx="73" cy="70" r="6"   fill="url(#gem)" stroke="#3d8a6a" stroke-width="1"/>
  <circle cx="73" cy="70" r="2.5" fill="rgba(255,255,255,0.6)"/>

  <!-- Base gems -->
  <circle cx="25" cy="83" r="4"   fill="#c9a84c"/>
  <circle cx="25" cy="83" r="1.6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="50" cy="83" r="5"   fill="#c9a84c"/>
  <circle cx="50" cy="83" r="2"   fill="rgba(255,255,255,0.65)"/>
  <circle cx="75" cy="83" r="4"   fill="#c9a84c"/>
  <circle cx="75" cy="83" r="1.6" fill="rgba(255,255,255,0.6)"/>
</svg>
